        $("#serverText").innerHTML = state.online
          ? "System online<br><b>Local server connected</b>"
          : "System offline<br><b>Server unreachable</b>";
        if (!state.online) {
          $("#view").innerHTML =
            `<div class="api-error"><b>Server connection unavailable.</b><br>${esc(state.error || "Please start the Node.js server and refresh this page.")}</div><button class="btn" data-action="refresh">Retry connection</button>`;
          return;
        }
        $("#view").innerHTML = pages[state.page]();
      }
      function fieldsFor(kind, record) {
        if (kind === "vehicles")
          return [
            {
              key: "name",
              label: "Vehicle name / plate number",
              required: true,
              placeholder: "e.g. Toyota 2A-1234",
              value: record?.name,
            },
            {
              key: "phone",
              label: "Owner phone number",
              placeholder: "e.g. 012 345 678",
              value: record?.phone,
            },
          ];
        if (kind === "slots")
          return [
            {
              key: "name",
              label: "Parking slot name",
              required: true,
              placeholder: "e.g. A-01",
              value: record?.name,
            },
            {
              key: "note",
              label: "Description",
              placeholder: "e.g. Ground floor, near entrance",
              value: record?.note,
            },
            {
              key: "zoneId",
              label: "Zone",
              options: state.zones.map((z) => ({ value: z.id, label: z.name })),
              value: record?.zoneId,
            },
          ];
        return [
          {
            key: "name",
            label: "Zone name",
            required: true,
            placeholder: "e.g. Zone A",
            value: record?.name,
          },
          {
            key: "note",
            label: "Description",
            placeholder: "e.g. First floor",
            value: record?.note,
          },
        ];
      }
      function openModal(title, fields, submit) {
        $("#modalTitle").textContent = title;
        $("#modalError").textContent = "";
        $("#modalFields").innerHTML = fields
          .map(
            (f) =>
              `<label class="field">${esc(f.label)}${f.options ? `<select name="${f.key}" ${f.required ? "required" : ""}><option value="">Select…</option>${f.options.map((o) => `<option value="${esc(o.value)}" ${String(o.value) === String(f.value ?? "") ? "selected" : ""}>${esc(o.label)}</option>`).join("")}</select>` : `<input name="${f.key}" value="${esc(f.value || "")}" placeholder="${esc(f.placeholder || "")}" ${f.required ? "required" : ""}>`}</label>`,
          )
          .join("");
        $("#modalForm").onsubmit = async (e) => {
          e.preventDefault();
          const values = Object.fromEntries(
            new FormData($("#modalForm")).entries(),
          );
          try {
            await submit(values);
            $("#modal").close();
          } catch (err) {
            $("#modalError").textContent = err.message;
          }
        };
        $("#modal").showModal();
        $("#modalFields").querySelector("input,select")?.focus();
      }
      function editRecord(kind, id) {
        const rec = id ? state[kind].find((x) => x.id === Number(id)) : null;
        openModal(
          (rec ? "Edit " : "Add ") +
            { vehicles: "vehicle", slots: "parking slot", zones: "zone" }[kind],
          fieldsFor(kind, rec),
          async (v) => {
            const body = { name: v.name.trim() };
            const extra = kind === "vehicles" ? "phone" : "note";
            if (v[extra]?.trim()) body[extra] = v[extra].trim();
            if (kind === "slots" && v.zoneId) body.zoneId = Number(v.zoneId);
            if (rec) await api("PUT", `/${kind}/${id}`, body);
            else await api("POST", `/${kind}`, body);
            toast(rec ? "Changes saved" : "Record added");
            await load();
          },
        );
      }
      function newParking(preSlot) {
        const free = state.slots.filter((s) => !currentForSlot(s.id)),
          busy = parkedVehicles(),
          cars = state.vehicles.filter((v) => !busy.has(v.id));
        if (!free.length)
          return toast("There are no available parking slots.", true);
        if (!cars.length)
          return toast("Register an available vehicle first.", true);
        openModal(
          "Start a parking session",
          [
            {
              key: "itemId",
              label: "Select parking slot",
              required: true,
              value: preSlot,
              options: free.map((s) => ({ value: s.id, label: s.name })),
            },
            {
              key: "personId",
              label: "Select vehicle",
              required: true,
              options: cars.map((v) => ({ value: v.id, label: v.name })),
            },
          ],
          async (v) => {
            await api("POST", "/parkings", {
              itemId: Number(v.itemId),
              personId: Number(v.personId),
            });
            toast("Vehicle checked in successfully");
            await load();
          },
        );
      }
      async function checkout(id) {
        if (!confirm("Confirm vehicle check-out?")) return;
        await api("PUT", `/parkings/${id}/end`);
        toast("Vehicle checked out");
        await load();
      }
      function exportCsv() {
        const rows = [
          ["Session ID", "Vehicle", "Slot", "Check in", "Check out", "Status"],
          ...state.parkings.map((p) => [
            p.id,
            vehicle(p.personId)?.name || "",
            slot(p.itemId)?.name || "",
            p.startedAt,
            p.endedAt || "",
            p.endedAt ? "Completed" : "Active",
          ]),
        ];
        const csv = rows
          .map((r) =>
            r
              .map((v) => '"' + String(v ?? "").replace(/"/g, '""') + '"')
              .join(","),
          )
          .join("\n");
        const blob = new Blob(["\ufeff" + csv], {
            type: "text/csv;charset=utf-8",
          }),
          url = URL.createObjectURL(blob),
          a = document.createElement("a");
        a.href = url;
        a.download = "parkeasy-parking-report.csv";
        a.click();
        URL.revokeObjectURL(url);
        toast("CSV report exported");
      }
      document.addEventListener("click", async (e) => {
        const nav = e.target.closest("[data-page]");
        if (nav) {
          state.page = nav.dataset.page;
          state.filter = "all";
          render();
          $("#sidebar").classList.remove("open");
          return;
        }
        const go = e.target.closest("[data-go]");
        if (go) {
          state.page = go.dataset.go;
          render();
          return;
        }
        const filter = e.target.closest("[data-filter]");
        if (filter) {
          state.filter = filter.dataset.filter;
          render();
          return;
        }
        const b = e.target.closest("[data-action]");
        if (!b) return;
        const { action, kind, id, slot: slotId } = b.dataset;
        try {
          if (action === "add") editRecord(kind);
          else if (action === "edit") editRecord(kind, id);
          else if (action === "add-slot") editRecord("slots");
          else if (action === "new-parking") newParking();
          else if (action === "park-slot") newParking(Number(slotId));
          else if (action === "checkout") await checkout(id);
          else if (action === "delete") {
            const rec = state[kind].find((x) => x.id === Number(id));
            if (kind === "slots" && currentForSlot(Number(id)))
              throw new Error(
                "This slot is occupied. Check out the vehicle before deleting it.",
              );
            if (kind === "vehicles" && parkedVehicles().has(Number(id)))
              throw new Error(
                "This vehicle is currently parked. Check it out before deleting it.",
              );
            if (
              kind === "zones" &&
              state.slots.some((s) => s.zoneId === Number(id))
            )
              throw new Error(
                "This zone still has parking slots. Move or delete them first.",
              );
            if (!confirm(`Delete ${rec?.name || "this record"}?`)) return;
            await api("DELETE", `/${kind}/${id}`);
            toast("Record deleted");
            await load();
          } else if (action === "delete-parking") {
            if (!confirm("Delete this parking history record?")) return;
            await api("DELETE", `/parkings/${id}`);
            toast("Parking record deleted");
            await load();
          } else if (action === "demo-data") {
            if (state.slots.length || state.vehicles.length)
              return toast(
                "Demo data can only be loaded into an empty project.",
                true,
              );
            if (
              !confirm(
                "Add example zones, slots, vehicles and parking sessions?",
              )
            )
              return;
            const za = await api("POST", "/zones", {
              name: "Zone A",
              note: "Ground floor",
            });
            const zb = await api("POST", "/zones", {
              name: "Zone B",
              note: "First floor",
            });
            for (const name of [
              "A-01",
              "A-02",
              "A-03",
              "A-04",
              "A-05",
              "A-06",
              "B-01",
              "B-02",
              "B-03",
              "B-04",
              "B-05",
              "B-06",
            ])
              await api("POST", "/slots", {
                name,
                zoneId: name.startsWith("A") ? za.id : zb.id,
              });
            for (const [name, phone] of [
              ["Toyota Camry · 2A-1234", "012 345 678"],
              ["Honda Civic · 1B-5521", "098 765 432"],
              ["Ford Ranger · 3C-9087", "077 112 233"],
              ["Hyundai Tucson · 2B-6688", "096 333 221"],
            ])
              await api("POST", "/vehicles", { name, phone });
            await api("POST", "/parkings", { itemId: 1, personId: 1 });
            await api("POST", "/parkings", { itemId: 7, personId: 2 });
            toast("Demo parking data created");
            await load();
          } else if (action === "export") exportCsv();
          else if (action === "print") window.print();
          else if (action === "refresh") await load();
        } catch (err) {
          toast(err.message, true);
        }
      });
      document.addEventListener("input", (e) => {
        if (e.target.matches("[data-search]")) {
          const q = e.target.value.toLowerCase().trim();
          $$("[data-search-row]").forEach(
            (r) => (r.hidden = !r.dataset.searchRow.includes(q)),
          );
        }
      });
      $("#globalSearch").addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        const q = e.target.value.toLowerCase().trim();
        if (!q) return;
        const inVehicles = state.vehicles.some((v) =>
          v.name.toLowerCase().includes(q),
        );
        const inSlots = state.slots.some((v) =>
          v.name.toLowerCase().includes(q),
        );
        if (inVehicles || inSlots) {
          state.page = inVehicles ? "vehicles" : "slots";
          render();
          const box = $("[data-search]");
          if (box) {
            box.value = q;
            box.dispatchEvent(new Event("input"));
          }
        } else toast("No matching vehicle or parking slot found");
      });
      $("#refreshBtn").addEventListener("click", load);
      $("#menuBtn").addEventListener("click", () =>
        $("#sidebar").classList.toggle("open"),
      );
      $("#modalClose").addEventListener("click", () => $("#modal").close());
      $("#modalCancel").addEventListener("click", () => $("#modal").close());
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") $("#sidebar").classList.remove("open");
      });
      load();
      setInterval(() => {
        if (state.online) load();
      }, 30000);
    </script>
  </body>
</html>
