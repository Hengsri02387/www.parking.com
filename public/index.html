city:0;transform:translateY(10px);pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1;transform:none}.toast.error{background:#b93847}.mobile-menu{display:none}.footer-note{font-size:10px;color:#9aa5b4;text-align:center;padding:20px 0 0}.api-error{padding:15px;background:var(--redbg);border:1px solid #f0c7cc;color:#a53340;border-radius:10px;margin-bottom:16px;font-size:12px}

<body>
<div class="shell">

  <div class="nav-label">WORKSPACE</div>
  <nav class="nav" id="nav">
    <button data-page="dashboard" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></svg>Dashboard</button>

    <div class="nav-label">MANAGEMENT</div>

    <button data-page="slots"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>Parking slots</button>
    <button data-page="zones"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 21V7l9-4 9 4v14M3 11h18M8 21v-5h8v5"/></svg>Zones</button>
    <button data-page="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>Parking history</button>
    <div class="nav-label">INSIGHTS</div>

</aside>
<section class="main">

</section>
</div>
<dialog class="modal" id="modal"><form id="modalForm"><div class="modal-head"><h3 id="modalTitle">Add record</h3><button type="button" class="iconbtn" id="modalClose">×</button></div><div class="modal-body" id="modalFields"></div><div class="modal-error" id="modalError" style="padding:0 22px"></div><div class="modal-foot"><button type="button" class="btn secondary" id="modalCancel">Cancel</button><button class="btn" id="modalSubmit">Save record</button></div></form></dialog>
<div class="toast" id="toast" role="status"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={slots:[],vehicles:[],parkings:[],zones:[],hasZones:true,page:'dashboard',filter:'all',query:'',online:true};
const api=async(method,url,body)=>{let r;try{r=await fetch(url,{method,headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});}catch(e){throw new Error('Cannot connect to the server. Please run npm start.')}let d;try{d=await r.json()}catch(e){d={}}if(!r.ok)throw new Error(d.error||`Request failed (${r.status})`);return d};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=v=>v?new Date(v).toLocaleString(undefined,{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const timeAgo=v=>{if(!v)return '';const m=Math.max(0,Math.floor((Date.now()-new Date(v))/60000));if(m<60)return `${m} min ago`;const h=Math.floor(m/60);if(h<24)return `${h} hr ago`;return `${Math.floor(h/24)} days ago`};
const active=p=>p.endedAt===null;
const currentForSlot=id=>state.parkings.find(p=>p.itemId===id&&active(p));
const vehicle=id=>state.vehicles.find(v=>v.id===id);
const slot=id=>state.slots.find(s=>s.id===id);
const parkedVehicles=()=>new Set(state.parkings.filter(active).map(p=>p.personId));
const fmtMoney=n=>'$'+Number(n||0).toFixed(2);
let toastTimer;
function toast(message,error=false){const el=$('#toast');el.textContent=message;el.className='toast show'+(error?' error':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.className='toast',2800)}
async function load(){try{const root=await api('GET','/');state.hasZones=root.resources.includes('/zones');const [slots,vehicles,parkings,zones]=await Promise.all([api('GET','/slots'),api('GET','/vehicles'),api('GET','/parkings'),state.hasZones?api('GET','/zones'):Promise.resolve([])]);Object.assign(state,{slots,vehicles,parkings,zones,online:true});}catch(e){state.online=false;state.error=e.message}render()}
function stats(){const total=state.slots.length,used=state.slots.filter(s=>currentForSlot(s.id)).length;return{total,used,free:total-used,rate:total?Math.round(used/total*100):0,vehicles:state.vehicles.length,active:state.parkings.filter(active).length}}
function pageHead(kicker,title,desc,actions=''){return `<div class="pagehead"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`}
function statCard(label,value,sub,icon,color='blue'){const bg=color==='green'?'var(--greenbg)':color==='red'?'var(--redbg)':color==='amber'?'var(--amberbg)':'var(--blue2)',fg=color==='green'?'var(--green)':color==='red'?'var(--red)':color==='amber'?'var(--amber)':'var(--blue)';return `<article class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon" style="background:${bg};color:${fg}">${icon}</span></div><strong>${value}</strong><div class="stat-foot">${sub}</div></article>`}
const ico={slot:'▦',car:'▰',clock:'◷',check:'✓'};
function recentRows(limit=5){return [...state.parkings].sort((a,b)=>new Date(b.startedAt)-new Date(a.startedAt)).slice(0,limit).map(p=>{const s=slot(p.itemId),v=vehicle(p.personId);return `<div class="activity-row"><div class="activity-icon ${p.endedAt?'red':''}">${p.endedAt?'↙':'↗'}</div><div class="activity-text"><b>${esc(v?.name||'Unknown vehicle')} · ${esc(s?.name||'Removed slot')}</b><small>${p.endedAt?'Parking session completed':'Parking session started'}</small></div><div class="activity-time">${timeAgo(p.endedAt||p.startedAt)}</div></div>`}).join('')||'<div class="empty">No parking activity yet.</div>'}
function dashboard(){const s=stats(),occupancy=s.total?Math.round(s.used/s.total*100):0;const days=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));return d});const daily=days.map(d=>state.parkings.filter(p=>{const x=new Date(p.startedAt);return x.toDateString()===d.toDateString()}).length);const max=Math.max(1,...daily);return `${pageHead('OVERVIEW','Good day, Administrator','Here is what is happening at your parking facility right now.',`${state.slots.length===0&&state.vehicles.length===0?'<button class="btn secondary" data-action="demo-data">＋ Load demo data</button>':''}<button class="btn secondary" data-action="export">⇩ Export data</button><button class="btn" data-action="new-parking">＋ New parking</button>`)}<section class="grid stats">${statCard('Total parking slots',s.total,'Configured spaces', '▦')}${statCard('Available spaces',s.free,`${s.total?Math.round(s.free/s.total*100):0}% of total capacity`,'✓','green')}${statCard('Occupied spaces',s.used,'Currently parked vehicles','▰','red')}${statCard('Registered vehicles',s.vehicles,'Vehicles in database','◉','amber')}</section><section class="grid two-col"><article class="panel"><div class="panel-head"><div><h3>Parking occupancy</h3><p>Live utilization across all parking slots</p></div><span class="status ${occupancy>=85?'red':'green'}">${occupancy>=85?'High occupancy':'Live status'}</span></div><div class="panel-body"><div class="occupancy"><div class="ring" style="--pct:${occupancy*3.6}deg"><div><strong>${occupancy}%</strong><small>OCCUPIED</small></div></div><div class="legend"><div class="legend-row"><span class="legend-label"><i class="swatch" style="background:var(--blue)"></i>Occupied</span><b>${s.used}</b></div><div class="legend-row"><span class="legend-label"><i class="swatch" style="background:#edf1f6"></i>Available</span><b>${s.free}</b></div><div class="legend-row"><span class="legend-label"><i class="swatch" style="background:var(--amber)"></i>Total capacity</span><b>${s.total}</b></div><button class="link" style="text-align:left;padding:8px 0 0" data-go="lot">View live parking lot →</button></div></div></div></article><article class="panel"><div class="panel-head"><div><h3>Parking activity</h3><p>Sessions started in the last 7 days</p></div><button class="link" data-go="reports">Full report →</button></div><div class="panel-body"><div class="chart">${daily.map((n,i)=>`<div class="bar-col"><div class="bar" title="${n} sessions" style="height:${Math.max(3,n/max*100)}%"></div><small>${days[i].toLocaleDateString(undefined,{weekday:'short'})}</small></div>`).join('')}</div></div></article></section><section class="grid two-col"><article class="panel"><div class="panel-head"><div><h3>Recent parking sessions</h3><p>Latest activity from your parking lot</p></div><button class="link" data-go="history">View all →</button></div><div class="panel-body"><div class="activity">${recentRows(5)}</div></div></article><article class="panel"><div class="panel-head"><div><h3>Facility summary</h3><p>Quick operational overview</p></div></div><div class="panel-body"><div class="legend"><div class="legend-row"><span class="legend-label">Total zones</span><b>${state.zones.length}</b></div><div class="legend-row"><span class="legend-label">Completed sessions</span><b>${state.parkings.filter(p=>!active(p)).length}</b></div><div class="legend-row"><span class="legend-label">Active sessions</span><b>${s.active}</b></div><div class="legend-row"><span class="legend-label">Capacity utilization</span><b>${occupancy}%</b></div></div><div style="margin-top:20px"><button class="btn secondary" style="width:100%;justify-content:center" data-go="vehicles">Manage registered vehicles</button></div></div></article></section><div class="footer-note">ParkEasy Parking Management System · Data is stored locally on your Node.js server</div>`}
function liveLot(){const s=stats();return `${pageHead('OPERATIONS','Live parking lot','Monitor every parking bay and manage vehicle entry and exit.',`<button class="btn secondary" data-action="add-slot">＋ Add slot</button><button class="btn" data-action="new-parking">＋ New parking</button>`)}<div class="lot-toolbar"><div class="filter-pills"><button class="pill ${state.filter==='all'?'active':''}" data-filter="all">All slots (${s.total})</button><button class="pill ${state.filter==='free'?'active':''}" data-filter="free">Available (${s.free})</button><button class="pill ${state.filter==='busy'?'active':''}" data-filter="busy">Occupied (${s.used})</button></div><span class="muted" style="font-size:11px">Updated ${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span></div><div class="parking-map"><div class="map-head"><b>MAIN PARKING AREA</b><span>● ${s.free} available &nbsp; ● ${s.used} occupied</span></div><div class="slot-grid">${state.slots.filter(x=>state.filter==='all'||(state.filter==='free'?!currentForSlot(x.id):!!currentForSlot(x.id))).map(x=>{const p=currentForSlot(x.id),v=p&&vehicle(p.personId);return `<div class="slot-tile ${p?'busy':'free'}"><div class="car-icon">${p?'🚙':'▱'}</div><strong>${esc(x.name)}</strong><small>${p?esc(v?.name||'Unknown vehicle'):'Ready for parking'}</small><span class="state">${p?'Occupied':'Available'}</span>${p?`<button data-action="checkout" data-id="${p.id}">Check out vehicle</button>`:`<button data-action="park-slot" data-slot="${x.id}">Assign vehicle</button>`}</div>`}).join('')||'<div class="empty" style="grid-column:1/-1;color:#b9c6d8">No slots match this filter.</div>'}</div></div><div class="grid stats" style="margin-top:17px">${statCard('Capacity',s.total,'Total configured slots','▦')}${statCard('Available',s.free,'Ready for incoming vehicles','✓','green')}${statCard('Occupied',s.used,'Currently in use','▰','red')}${statCard('Utilization',s.rate+'%','Current occupancy rate','◉','amber')}</div>`}
function badge(p){return p.endedAt?'<span class="status green">Completed</span>':'<span class="status red">Parked now</span>'}
function tablePanel(headers,rows,empty,search=true){return `<div class="panel"><div class="panel-head"><div><h3>${empty.title||'Records'}</h3><p>${empty.sub||''}</p></div>${search?'<input class="table-search" data-search placeholder="Search records…">':''}</div><div class="table-wrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}"><div class="empty"><b>${empty.message||'No records found'}</b>${empty.hint||''}</div></td></tr>`}</tbody></table></div></div>`}
function vehiclesPage(){const rows=state.vehicles.map(v=>`<tr data-search-row="${esc([v.id,v.name,v.phone].join(' ').toLowerCase())}"><td class="muted">VEH-${String(v.id).padStart(4,'0')}</td><td><b class="strong">${esc(v.name)}</b></td><td>${esc(v.phone||'—')}</td><td>${parkedVehicles().has(v.id)?'<span class="status red">Currently parked</span>':'<span class="status green">Not parked</span>'}</td><td><button class="btn secondary sm" data-action="edit" data-kind="vehicles" data-id="${v.id}">Edit</button> <button class="btn danger sm" data-action="delete" data-kind="vehicles" data-id="${v.id}">Delete</button></td></tr>`).join('');return `${pageHead('MANAGEMENT','Vehicle registry','Register and maintain vehicle details for parking operations.',`<button class="btn" data-action="add" data-kind="vehicles">＋ Register vehicle</button>`)}${tablePanel(['Vehicle ID','Vehicle / plate number','Owner phone','Parking status','Actions'],rows,{title:'Registered vehicles',sub:`${state.vehicles.length} vehicles in your database`,message:'No vehicles registered',hint:'Add a vehicle to start a parking session.'})}`}
function slotsPage(){const rows=state.slots.map(v=>`<tr data-search-row="${esc([v.id,v.name,v.note].join(' ').toLowerCase())}"><td class="muted">SL-${String(v.id).padStart(4,'0')}</td><td><b class="strong">${esc(v.name)}</b></td><td>${esc(v.note||'—')}</td><td>${currentForSlot(v.id)?'<span class="status red">Occupied</span>':'<span class="status green">Available</span>'}</td><td><button class="btn secondary sm" data-action="edit" data-kind="slots" data-id="${v.id}">Edit</button> <button class="btn danger sm" data-action="delete" data-kind="slots" data-id="${v.id}">Delete</button></td></tr>`).join('');return `${pageHead('MANAGEMENT','Parking slots','Create and organize the individual parking spaces in your facility.',`<button class="btn" data-action="add" data-kind="slots">＋ Add parking slot</button>`)}${tablePanel(['Slot ID','Slot name','Description','Availability','Actions'],rows,{title:'Parking slot directory',sub:`${state.slots.length} parking spaces configured`,message:'No parking slots created',hint:'Add slots to build your parking lot.'})}`}
function zonesPage(){const rows=state.zones.map(z=>{const ss=state.slots.filter(s=>String(s.note||'').toLowerCase().includes(z.name.toLowerCase()));const used=ss.filter(s=>currentForSlot(s.id)).length;return `<article class="zone-card"><div style="display:flex;justify-content:space-between;gap:8px"><div><h3>${esc(z.name)}</h3><p>${esc(z.note||'Parking area')}</p></div><span class="status green">Active</span></div><div class="zone-count">${ss.length}<small> slots matched</small></div><div class="progress"><span style="width:${ss.length?used/ss.length*100:0}%"></span></div><div style="display:flex;justify-content:space-between;margin-top:8px;color:var(--muted);font-size:10px"><span>${used} occupied</span><span>${ss.length-used} available</span></div><div style="margin-top:15px"><button class="btn secondary sm" data-action="edit" data-kind="zones" data-id="${z.id}">Edit zone</button> <button class="btn danger sm" data-action="delete" data-kind="zones" data-id="${z.id}">Delete</button></div></article>`}).join('');return `${pageHead('MANAGEMENT','Parking zones','Group and organize parking spaces by area or floor.',`<button class="btn" data-action="add" data-kind="zones">＋ Add zone</button>`)}<div class="grid zone-grid">${rows||'<div class="panel empty" style="grid-column:1/-1"><b>No zones created</b>Create zones to organize your facility.</div>'}</div><p class="muted" style="font-size:10px;margin-top:14px">Note: Zone-to-slot assignment is currently descriptive; slots are managed independently in this assignment version.</p>`}
function historyPage(){const list=[...state.parkings].sort((a,b)=>new Date(b.startedAt)-new Date(a.startedAt));const rows=list.map(p=>{const v=vehicle(p.personId),s=slot(p.itemId);return `<tr data-search-row="${esc([p.id,v?.name,s?.name,p.endedAt?'completed':'active'].join(' ').toLowerCase())}"><td class="muted">PK-${String(p.id).padStart(4,'0')}</td><td><b class="strong">${esc(v?.name||'Unknown vehicle')}</b></td><td>${esc(s?.name||'Removed slot')}</td><td>${date(p.startedAt)}</td><td>${p.endedAt?date(p.endedAt):'<span class="muted">In progress</span>'}</td><td>${badge(p)}</td><td>${p.endedAt?'':`<button class="btn success sm" data-action="checkout" data-id="${p.id}">Check out</button>`} <button class="btn danger sm" data-action="delete-parking" data-id="${p.id}">Delete</button></td></tr>`}).join('');return `${pageHead('MANAGEMENT','Parking history','Review active and completed parking sessions.',`<button class="btn secondary" data-action="export">⇩ Export CSV</button><button class="btn" data-action="new-parking">＋ New parking</button>`)}${tablePanel(['Session ID','Vehicle','Parking slot','Check-in time','Check-out time','Status','Actions'],rows,{title:'All parking sessions',sub:`${list.length} total records`,message:'No parking sessions yet',hint:'New parking sessions will appear here.'})}`}
function reportsPage(){const total=state.parkings.length,done=state.parkings.filter(p=>p.endedAt),ongoing=total-done.length;const avg=done.length?Math.round(done.reduce((n,p)=>n+(new Date(p.endedAt)-new Date(p.startedAt))/60000,0)/done.length):0;const hours=[0,0,0,0,0,0];state.parkings.forEach(p=>{const h=new Date(p.startedAt).getHours();hours[Math.min(5,Math.floor(h/4))]++});const max=Math.max(1,...hours);return `${pageHead('INSIGHTS','Reports & analytics','A clear overview of parking activity and facility performance.',`<button class="btn secondary" data-action="export">⇩ Export CSV</button><button class="btn" data-action="print">Print report</button>`)}<div class="grid stats">${statCard('Total sessions',total,'All recorded entries','◷')}${statCard('Completed sessions',done.length,'Vehicles checked out','✓','green')}${statCard('Active sessions',ongoing,'Vehicles currently parked','▰','red')}${statCard('Average stay',avg?avg+' min':'—','Based on completed sessions','⌁','amber')}</div><div class="grid report-grid"><article class="panel report-card"><h3>Parking session status</h3><p>Distribution of all recorded parking sessions</p><div class="report-number">${total?Math.round(done.length/total*100):0}%</div><div class="progress" style="height:10px"><span style="width:${total?done.length/total*100:0}%;background:var(--green)"></span></div><div class="legend" style="margin-top:18px"><div class="legend-row"><span class="legend-label">Completed</span><b>${done.length}</b></div><div class="legend-row"><span class="legend-label">Active</span><b>${ongoing}</b></div></div></article><article class="panel report-card"><h3>Activity by time of day</h3><p>Parking check-ins grouped into four-hour periods</p><div class="report-bars">${hours.map((n,i)=>`<div class="report-bar"><span>${['12 AM–4 AM','4 AM–8 AM','8 AM–12 PM','12 PM–4 PM','4 PM–8 PM','8 PM–12 AM'][i]}</span><div><span style="width:${n/max*100}%"></span></div><b>${n}</b></div>`).join('')}</div></article></div><p class="muted" style="font-size:10px;margin-top:16px">Reports are calculated from the parking session records currently stored in the local JSON database. No payment or revenue data is collected by this project.</p>`}
function render(){const pages={dashboard,lot:liveLot,vehicles:vehiclesPage,slots:slotsPage,zones:zonesPage,history:historyPage,reports:reportsPage};const labels={dashboard:'Dashboard',lot:'Live parking lot',vehicles:'Vehicles',slots:'Parking slots',zones:'Zones',history:'Parking history',reports:'Reports'};$('#crumb').textContent=labels[state.page];$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));if(!state.online){$('#view').innerHTML=`<div class="api-error"><b>Server connection unavailable.</b><br>${esc(state.error||'Please start the Node.js server and refresh this page.')}</div><button class="btn" data-action="refresh">Retry connection</button>`;return}$('#view').innerHTML=pages[state.page]();}
function fieldsFor(kind,record){if(kind==='vehicles')return[{key:'name',label:'Vehicle name / plate number',required:true,placeholder:'e.g. Toyota 2A-1234',value:record?.name},{key:'phone',label:'Owner phone number',placeholder:'e.g. 012 345 678',value:record?.phone}];if(kind==='slots')return[{key:'name',label:'Parking slot name',required:true,placeholder:'e.g. A-01',value:record?.name},{key:'note',label:'Description',placeholder:'e.g. Ground floor, near entrance',value:record?.note}];return[{key:'name',label:'Zone name',required:true,placeholder:'e.g. Zone A',value:record?.name},{key:'note',label:'Description',placeholder:'e.g. First floor',value:record?.note}]}
function openModal(title,fields,submit){$('#modalTitle').textContent=title;$('#modalError').textContent='';$('#modalFields').innerHTML=fields.map(f=>`<label class="field">${esc(f.label)}${f.options?`<select name="${f.key}" ${f.required?'required':''}><option value="">Select…</option>${f.options.map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(f.value??'')?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`:`<input name="${f.key}" value="${esc(f.value||'')}" placeholder="${esc(f.placeholder||'')}" ${f.required?'required':''}>`}</label>`).join('');$('#modalForm').onsubmit=async e=>{e.preventDefault();const values=Object.fromEntries(new FormData($('#modalForm')).entries());try{await submit(values);$('#modal').close()}catch(err){$('#modalError').textContent=err.message}};$('#modal').showModal();$('#modalFields').querySelector('input,select')?.focus()}
function editRecord(kind,id){const rec=id?state[kind].find(x=>x.id===Number(id)):null;openModal((rec?'Edit ':'Add ')+({vehicles:'vehicle',slots:'parking slot',zones:'zone'}[kind]),fieldsFor(kind,rec),async v=>{const body={name:v.name.trim()};const extra=kind==='vehicles'?'phone':'note';if(v[extra]?.trim())body[extra]=v[extra].trim();if(rec)await api('PUT',`/${kind}/${id}`,body);else await api('POST',`/${kind}`,body);toast(rec?'Changes saved':'Record added');await load()})}
function newParking(preSlot){const free=state.slots.filter(s=>!currentForSlot(s.id)),busy=parkedVehicles(),cars=state.vehicles.filter(v=>!busy.has(v.id));if(!free.length)return toast('There are no available parking slots.',true);if(!cars.length)return toast('Register an available vehicle first.',true);openModal('Start a parking session',[{key:'itemId',label:'Select parking slot',required:true,value:preSlot,options:free.map(s=>({value:s.id,label:s.name}))},{key:'personId',label:'Select vehicle',required:true,options:cars.map(v=>({value:v.id,label:v.name}))}],async v=>{await api('POST','/parkings',{itemId:Number(v.itemId),personId:Number(v.personId)});toast('Vehicle checked in successfully');await load()})}
async function checkout(id){if(!confirm('Confirm vehicle check-out?'))return;await api('PUT',`/parkings/${id}/end`);toast('Vehicle checked out');await load()}
function exportCsv(){const rows=[['Session ID','Vehicle','Slot','Check in','Check out','Status'],...state.parkings.map(p=>[p.id,vehicle(p.personId)?.name||'',slot(p.itemId)?.name||'',p.startedAt,p.endedAt||'',p.endedAt?'Completed':'Active'])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='parkeasy-parking-report.csv';a.click();URL.revokeObjectURL(url);toast('CSV report exported')}
document.addEventListener('click',async e=>{const nav=e.target.closest('[data-page]');if(nav){state.page=nav.dataset.page;state.filter='all';render();$('#sidebar').classList.remove('open');return}const go=e.target.closest('[data-go]');if(go){state.page=go.dataset.go;render();return}const filter=e.target.closest('[data-filter]');if(filter){state.filter=filter.dataset.filter;render();return}const b=e.target.closest('[data-action]');if(!b)return;const {action,kind,id,slot:slotId}=b.dataset;try{if(action==='add')editRecord(kind);else if(action==='edit')editRecord(kind,id);else if(action==='add-slot')editRecord('slots');else if(action==='new-parking')newParking();else if(action==='park-slot')newParking(Number(slotId));else if(action==='checkout')await checkout(id);else if(action==='delete'){const rec=state[kind].find(x=>x.id===Number(id));if(kind==='slots'&&currentForSlot(Number(id)))throw new Error('This slot is occupied. Check out the vehicle before deleting it.');if(kind==='vehicles'&&parkedVehicles().has(Number(id)))throw new Error('This vehicle is currently parked. Check it out before deleting it.');if(!confirm(`Delete ${rec?.name||'this record'}?`))return;await api('DELETE',`/${kind}/${id}`);toast('Record deleted');await load()}else if(action==='delete-parking'){if(!confirm('Delete this parking history record?'))return;await api('DELETE',`/parkings/${id}`);toast('Parking record deleted');await load()}else if(action==='demo-data'){if(state.slots.length||state.vehicles.length)return toast('Demo data can only be loaded into an empty project.',true);if(!confirm('Add example zones, slots, vehicles and parking sessions?'))return;for(const name of ['Zone A','Zone B'])await api('POST','/zones',{name,note:name==='Zone A'?'Ground floor':'First floor'});for(const name of ['A-01','A-02','A-03','A-04','A-05','A-06','B-01','B-02','B-03','B-04','B-05','B-06'])await api('POST','/slots',{name,note:name.startsWith('A')?'Zone A':'Zone B'});for(const [name,phone] of [['Toyota Camry · 2A-1234','012 345 678'],['Honda Civic · 1B-5521','098 765 432'],['Ford Ranger · 3C-9087','077 112 233'],['Hyundai Tucson · 2B-6688','096 333 221']])await api('POST','/vehicles',{name,phone});await api('POST','/parkings',{itemId:1,personId:1});await api('POST','/parkings',{itemId:7,personId:2});toast('Demo parking data created');await load()}else if(action==='export')exportCsv();else if(action==='print')window.print();else if(action==='refresh')await load()}catch(err){toast(err.message,true)}});
document.addEventListener('input',e=>{if(e.target.matches('[data-search]')){const q=e.target.value.toLowerCase().trim();$$('[data-search-row]').forEach(r=>r.hidden=!r.dataset.searchRow.includes(q))}});
$('#globalSearch').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const q=e.target.value.toLowerCase().trim();if(!q)return;const inVehicles=state.vehicles.some(v=>v.name.toLowerCase().includes(q));const inSlots=state.slots.some(v=>v.name.toLowerCase().includes(q));if(inVehicles||inSlots){state.page=inVehicles?'vehicles':'slots';render();const box=$('[data-search]');if(box){box.value=q;box.dispatchEvent(new Event('input'))}}else toast('No matching vehicle or parking slot found')});
$('#refreshBtn').addEventListener('click',load);$('#menuBtn').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));$('#modalClose').addEventListener('click',()=>$('#modal').close());$('#modalCancel').addEventListener('click',()=>$('#modal').close());window.addEventListener('keydown',e=>{if(e.key==='Escape')$('#sidebar').classList.remove('open')});load();setInterval(()=>{if(state.online)load()},30000);
</script>
</body></html>
